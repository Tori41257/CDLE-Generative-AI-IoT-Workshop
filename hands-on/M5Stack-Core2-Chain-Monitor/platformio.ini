[env:m5stack-core2]
platform = espressif32@6.12.0
board = m5stack-core2
framework = arduino

monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv

lib_deps =
    m5stack/M5Unified@^0.2.21
    https://github.com/m5stack/M5Chain.git#1.0.8

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

